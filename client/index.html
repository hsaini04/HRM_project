<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Lutron SkillBridge — an academic prototype for employee training and skill development (synthetic demo data only)." />
    <title>Lutron SkillBridge — Training & Skill Development (Demo)</title>
    <script>
      // Apply the saved (or system) colour theme before first paint, so dark mode never flashes light.
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem('skillbridge.theme');
        } catch (error) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
